# dsh-auth bundle layer: 为 web 表面加认证网关（登录保护 + 空闲自动登出 + 设置界面）。
# 配置默认值可在这里覆盖；运行期修改（设置界面 / dsh web p）写入 $DSH_HOME/auth.json。
- insert:
    - id: dsh-auth
      name: '@tyler9061/dsh-auth'
      config:
        enabled: true
        idleMinutes: 30
        maxAgeMinutes: 1440

# ── 网络访问（绑定 0.0.0.0）───────────────────────────────────────────────
# dsh CLI 出于安全禁止 --host 0.0.0.0；装了认证插件后由认证网关保护，
# 这里直接覆盖 webserver 行的配置允许对外绑定：
#   - 默认绑定 0.0.0.0（局域网可访问，登录页 + 认证网关保护）
#   - 设环境变量 DSH_AUTH_BIND=127.0.0.1 或命令行 --host 127.0.0.1 可仅本机
#   - 注意：--host 0.0.0.0 仍会被 CLI 拒绝；--host 其他值也不被 webserver 模式接受
- id: webserver
  inject: [webStartup]
  config:
    host: !!js "ctx.webStartup.host ?? (process.env.DSH_AUTH_BIND === '127.0.0.1' ? '127.0.0.1' : '0.0.0.0')"
    port: !!js ctx.webStartup.port ?? 3080
