# dsh-auth bundle layer: 为 web 表面加认证网关（登录保护 + 空闲自动登出 + 设置界面）。
# 配置默认值可在这里覆盖；运行期修改（设置界面 / dsh web p）写入 $DSH_HOME/auth.json。
- insert:
    - id: dsh-auth
      name: '@tyler9061/dsh-auth'
      config:
        enabled: true
        idleMinutes: 30
        maxAgeMinutes: 1440
        lanProxy: true
        lanPort: 3080

# ── 网络访问（反向代理）────────────────────────────────────────────────────
# DSH 的 /api 有 browser-trust 围栏（仅信任回环 + 派生 LAN IP，但连接行配置
# 传递有 bug，LAN 直连时 /api 全部 403）。改为：真实服务器只绑 127.0.0.1，
# 插件另起一个 0.0.0.0:<lanPort> 的反代，把请求转给回环并改写 Host/Origin，
# 让围栏按回环放行 —— 局域网下所有 /api（设置/文件/变更等插件）都可用。
# 环境变量 DSH_AUTH_PORT 可覆盖 lanPort；DSH_AUTH_PROXY=off 可关闭反代。
- id: webserver
  inject: [webStartup]
  config:
    host: '127.0.0.1'
    port: 0
